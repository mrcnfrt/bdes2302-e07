<html>

<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script
        src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
</head>

<body>
    <a-scene>
        <a-entity environment="preset: forest; dressingAmount: 500"></a-entity>
        <a-box color="red" position="0 1.6 -5" rotation="0 45 45" scale="1.5 1.5 1.5"
            animation="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"
            animation__mouseenter="property: scale; to: 2.3 2.3 2.3; dur: 300; startEvents: mouseenter"
            animation__mouseleave="property: scale; to: 2 2 2; dur: 300; startEvents: mouseleave">
        </a-box>

        <a-sound src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" autoplay="true" loop
            position="-3 1 -4">
        </a-sound>

        <a-entity text="value: Floating Cube; color: #FAFAFA; width: 5; anchor: align; aling: center"
            position="0 0.5 -3" scale="1.5 1.5 1.5">
        </a-entity>

        <a-entity gltf-model="url(matilda.glb)" scale="0.04 0.04 0.04" position="0 0 -8"></a-entity>

       <!---- <a-camera>
            <a-cursor color="#FAFAFA"></a-cursor>
        </a-camera> --> 

        <a-entity id="rig" movement-controls position="0 0 0">
            <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: true">
                <a-cursor color="#FAFAFA"></a-cursor>
            </a-entity>
        </a-entity>

    </a-scene>
</body>

</html>
